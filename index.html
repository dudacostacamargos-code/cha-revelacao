<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmação • Chá Revelação</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#71805a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--olive:#71805a;--olive2:#5d6c49;--pink:#f4d8dc;--pink2:#f9eef0;--cream:#fffaf7;--text:#3f4039;--muted:#77786f;--white:#fff;--line:#e8e2dd;--danger:#a85b63}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,var(--pink2),var(--cream));font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.wrap{max-width:980px;margin:auto;padding:22px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 28px rgba(70,60,50,.08);margin-bottom:18px}.brand{text-align:center;padding:30px 20px}.brand .leaf{font-size:38px}.brand h1{font-family:Georgia,serif;font-weight:500;margin:8px 0;color:var(--olive2)}.brand p{margin:4px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;border-radius:18px;background:var(--pink2);text-align:center}.stat b{font-size:28px;color:var(--olive2);display:block}.stat span{font-size:13px;color:var(--muted)}
.btn{border:0;border-radius:13px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:var(--olive);color:white}.secondary{background:var(--pink);color:var(--text)}.danger{background:#f5e1e3;color:var(--danger)}.btn:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:13px;color:var(--muted);line-height:1.5}.family{border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:10px}.family-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700}.pending{background:#eeeae4}.yes{background:#e4eddc;color:#4d623d}.no{background:#f4e0e3;color:#8e4d55}.member{font-size:13px;color:var(--muted);margin-top:7px}.notice{padding:13px 15px;border-radius:14px;background:#fbf5ed;font-size:13px;line-height:1.45}.guest{text-align:center;max-width:620px;margin:0 auto}.guest h2{font-family:Georgia,serif;color:var(--olive2);font-weight:500}.guest-actions{display:grid;gap:12px;margin-top:24px}.guest-actions .btn{padding:16px;font-size:16px}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted)}
@media(max-width:680px){.grid,.two{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:16px}.brand{padding:24px 12px}}
</style></head>
<body><main class="wrap" id="app"></main>
<script>
const API_URL='COLE_AQUI_A_URL_DO_APPS_SCRIPT';
const params=new URLSearchParams(location.search); const token=params.get('familia');
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function shell(content){app.innerHTML=`<section class="card brand"><div class="leaf">🌿</div><h1>Chá Revelação</h1><p>Confirmação de presença</p></section>${content}`}
async function api(action,data={}){if(API_URL.startsWith('COLE_')) throw new Error('Configure a URL do Apps Script no arquivo index.html.'); const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})}); return await r.json()}
function guest(){shell(`<section class="card guest"><p class="small">Confirmação de presença</p><h2>Olá! 💕</h2><p>O convite para o nosso chá revelação já foi enviado. Estamos apenas registrando a confirmação da família.</p><div id="guestBox"><p>Carregando convite...</p></div></section>`); loadGuest()}
async function loadGuest(){try{const r=await api('getFamily',{token});if(!r.ok)throw Error(r.message); const names=r.family.members.map(esc).join('<br>'); document.getElementById('guestBox').innerHTML=`<p><b>${esc(r.family.name)}</b></p><p class="hint">Convidados vinculados a este convite:<br>${names}</p><div class="guest-actions"><button class="btn primary" onclick="answer('CONFIRMADO')">✅ Confirmar presença</button><button class="btn danger" onclick="answer('NAO_COMPARECEREI')">❌ Não poderei comparecer</button></div><p class="small" style="margin-top:20px">A confirmação é definitiva e deve corresponder às pessoas listadas no convite.</p>`}catch(e){document.getElementById('guestBox').innerHTML=`<div class="notice">${esc(e.message||'Não foi possível carregar este convite.')}</div>`}}
async function answer(status){const box=document.getElementById('guestBox');box.innerHTML='<p>Registrando sua resposta...</p>';try{const r=await api('answer',{token,status});if(!r.ok)throw Error(r.message);box.innerHTML=`<h2>${status==='CONFIRMADO'?'Presença confirmada! 💕':'Sentiremos a sua falta! 💕'}</h2><p>${status==='CONFIRMADO'?'Obrigada por confirmar. Estamos muito felizes em contar com vocês!':'Obrigada por nos avisar.'}</p><p class="small">Sua resposta foi registrada e não poderá ser alterada por este link.</p>`}catch(e){box.innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
function admin(){shell(`<section class="card"><h2 style="margin-top:0;color:var(--olive2)">Painel de confirmações</h2><div class="notice">Cadastre cada família exatamente como consta no convite. O convidado não poderá acrescentar pessoas, acompanhantes ou alterar a resposta.</div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="pickContacts()">📱 Selecionar contatos</button><button class="btn secondary" onclick="manualFamily()">＋ Cadastrar família</button><button class="btn secondary" onclick="loadDashboard()">↻ Atualizar</button><button id="installBtn" class="btn secondary hidden" onclick="installPWA()">📲 Adicionar à tela inicial</button></div><div id="dash" style="margin-top:18px"></div></section>`);loadDashboard()}
async function pickContacts(){if(!('contacts' in navigator&&'ContactsManager' in window)){alert('Seu navegador não oferece o seletor de contatos. Use o botão “Cadastrar família” ou abra este painel no Chrome do Android em uma conexão segura (HTTPS).');return}try{const props=['name','tel'];const opts={multiple:true};const contacts=await navigator.contacts.select(props,opts); if(!contacts.length)return; const famName=prompt('Nome da família/grupo do convite:');if(!famName)return; const members=[];for(const c of contacts){const name=(c.name||['Convidado'])[0];const tel=(c.tel||[''])[0];members.push({name,tel})} const r=await api('createFamily',{name:famName,members});if(!r.ok)throw Error(r.message);alert('Família cadastrada.');loadDashboard()}catch(e){if(e.name!=='AbortError')alert(e.message||'Não foi possível selecionar os contatos.')}}
async function manualFamily(){const name=prompt('Nome da família/grupo do convite:');if(!name)return;const raw=prompt('Digite os nomes das pessoas, separados por vírgula. Ex.: João, Maria, Pedro');if(!raw)return;const members=raw.split(',').map(x=>({name:x.trim(),tel:''})).filter(x=>x.name);const r=await api('createFamily',{name,members});if(!r.ok)alert(r.message);else loadDashboard()}
async function loadDashboard(){const d=document.getElementById('dash');if(!d)return;d.innerHTML='<p>Carregando...</p>';try{const r=await api('listFamilies');if(!r.ok)throw Error(r.message);const f=r.families;const yes=f.filter(x=>x.status==='CONFIRMADO');const no=f.filter(x=>x.status==='NAO_COMPARECEREI');const pending=f.filter(x=>!x.status);const people=x=>x.members.length;const totalYes=yes.reduce((a,x)=>a+people(x),0);d.innerHTML=`<div class="grid"><div class="stat"><b>${yes.length}</b><span>Famílias confirmadas</span></div><div class="stat"><b>${no.length}</b><span>Famílias que não irão</span></div><div class="stat"><b>${pending.length}</b><span>Ainda sem resposta</span></div></div><p><b>👥 Pessoas confirmadas: ${totalYes}</b></p><div class="row"><button class="btn secondary" onclick="sendAll()">💬 Lembrete para quem não respondeu</button></div>${f.map(renderFamily).join('')}` }catch(e){d.innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
function renderFamily(x){const badge=x.status==='CONFIRMADO'?'<span class="badge yes">CONFIRMADA</span>':x.status==='NAO_COMPARECEREI'?'<span class="badge no">NÃO IRÁ</span>':'<span class="badge pending">SEM RESPOSTA</span>';const url=location.origin+location.pathname+'?familia='+encodeURIComponent(x.token);const msg=`Olá, ${x.name}! 💕 Passando para lembrar que 07/10 é o último dia para confirmar a presença no nosso chá revelação. Para registrar a confirmação da família, acesse: ${url}`;const wa=x.phone?'https://wa.me/'+x.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(msg):'';return `<div class="family"><div class="family-head"><div><b>${esc(x.name)}</b><div class="member">${x.members.map(m=>esc(m.name)).join(', ')}</div></div>${badge}</div><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="navigator.clipboard?.writeText('${url}').then(()=>alert('Link copiado.'))">🔗 Copiar link</button>${wa?`<a class="btn primary" target="_blank" href="${wa}">💬 WhatsApp</a>`:''}</div></div>`}
async function sendAll(){const r=await api('listFamilies');if(!r.ok)return alert(r.message);const pending=r.families.filter(x=>!x.status&&x.phone);if(!pending.length)return alert('Não há famílias pendentes com telefone cadastrado.');if(!confirm(`Serão abertas ${pending.length} conversas do WhatsApp, uma por vez. Continuar?`))return;for(const x of pending){const url=location.origin+location.pathname+'?familia='+encodeURIComponent(x.token);const msg=`Olá, ${x.name}! 💕 Passando para lembrar que 07/10 é o último dia para confirmar a presença no nosso chá revelação. Para registrar a confirmação da família, acesse: ${url}`;window.open('https://wa.me/'+x.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}}
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();deferredInstallPrompt=e; const b=document.getElementById('installBtn'); if(b)b.classList.remove('hidden')});
async function installPWA(){if(!deferredInstallPrompt){alert('No Chrome do Android, use o menu ⋮ e escolha “Adicionar à tela inicial” ou “Instalar aplicativo”.');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;const b=document.getElementById('installBtn');if(b)b.classList.add('hidden')}
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
if(token)guest();else admin();
</script></body></html>
